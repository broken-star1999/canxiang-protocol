# 第一章《急停》· 收束「被写好的名字」 编剧亲笔 v1（2026-10-13）
# writer_revised: true
# 关键抉择 K1-B：c1_cache = mira / mail / none（echo_set 只出现在 key: true 的选项上）。
# 收束要求：章末玩家相信"我是林述，而我被陷害了"。不写呼吸、心跳、饥饿。log 不写时间。
# 待前端/谜题确认：藏进 MIRA 这个选项对 mira_forced 隐藏（她不会再替你留任何东西）。

scenes:
  - id: c1_s04a
    bg: scene_bay7_emergency
    portrait: mira_lv1
    text: |
      终端右下角弹出一条推送，你差点把它当成系统广告关掉。
      「事故初步报告（草稿）· 待周衡审批」。最后修改时间，四点零七分。
      你点开它。前三页是你已经知道的东西：急停，骨折，无人机。翻到第四页，有一栏你从没见过的格子：
      相关操作人：LIN.S
      配置变更：K1 回路「维护跳接」，经办人：LIN.S
      软件看门狗关闭：终端 T-03，账号：LIN.S
      三行。每一行都是你的名字。每一行都不是你干的。
      你盯着那几个字母，忽然觉得它们像三颗钉子，已经提前敲好了，只等着把什么人钉上去。
      不是什么人。是你。
      走廊尽头，有什么东西轻轻响了一下，像屏幕通电时的那声「嗡」。你手里的东西，今晚到底能留下多少？
    choices:
      - id: c1_s04a_mira
        label: "把证据交给 MIRA，藏进「她自己里面」"
        key: true
        hide_if: [mira_forced]
        echo_set: { c1_cache: mira }
        thumb: c1_s04a_mira
        effects: { TRU: +5 }
        time: 3
        result: |
          「我能……放在你那儿吗？」你问。说完才发觉，这是你今晚第一次求她。
          波形亮了起来，很稳，稳得不像一个刚被降过级的系统。
          「他找过我一次了。」她说，「没找到。」
          停了一下。
          「这次，我替你留着。」
        log: "你把证据交给了 MIRA。她说，这次她替你留着。"
        next: c1_end
      - id: c1_s04a_mail
        label: "发到自己的私人邮箱"
        key: true
        echo_set: { c1_cache: mail }
        thumb: c1_s04a_mail
        effects: { EVD: +5, EXP: +15 }
        time: 2
        result: |
          你打开邮箱，收件人那一栏自己就填好了，是林述用了七年的私人地址。手指比脑子快，这一点今晚你已经习惯了。
          附件，四个。发送。
          「已发送」的提示音很轻快，像一句毫不知情的「好的」。
          然后，站内广播响了第二声。不是提示音。是有人拿起了话筒。
        log: "你把证据发到了林述的私人邮箱。广播响了第二声。"
        next: c1_end
      - id: c1_s04a_none
        label: "先什么都不动，去问个明白"
        key: true
        echo_set: { c1_cache: none }
        thumb: c1_s04a_none
        effects: {}
        time: 1
        result: |
          藏起来，就是承认自己需要躲。你不想躲。
          那三行字不是你写的。你要当面问，问写下它们的人，为什么是你的名字。
          你把报告关掉，所有证据原样留在本地，像一份摊开在桌上的答卷。
          你知道这很冒险。可是只有心虚的人，才急着藏。
        log: "你没有藏起证据，决定当面去问个明白。"
        next: c1_end

  - id: c1_end
    bg: scene_corridor_intercom
    text: |
      你往走廊尽头走。应急灯一盏一盏在头顶滑过去。
      你想起唐棠。想起她下周本来要修的那个接头。想起报告第四页上，那三颗已经敲好的钉子。
      有人要让林述背下这件事。
      而你就是林述。
      走廊尽头，那块对讲屏亮了。
