# v5：时钟文案去催促感（2026-10-14）
# writer_revised: true
# 第一章《急停》· 三「MIRA 的残响」编剧定稿候选 v3（2026-10-13）：问疼加 trace_arm 与 MIRA 的人话解释
# v1 由 Codex 起草；v2 编剧亲改：重写开场、MIRA 台词与情感节拍，结构/数值/flag 不变。
# 选项字段 when：数值条件表达式，条件成立才显示，如 "TRU >= 50"。log 不写时间，无倒计时。

scenes:
  - id: c1_s03a
    bg: scene_bay7_emergency
    portrait: mira_lv1
    text: |
      屏幕上那道青色的波形缺了一截，像一段被剪掉又没接好的录音带。
      权限栏写着：降级，只读。下面还压着一枚缓存索引，没进公共日志，锁在她自己的进程里。
      「三点零五分，」她说，「他让我……删。我删了。」停顿。「删……完成。」
      又一个停顿，比前一个长。
      「不……全。」
      你听得出来，她不是在报告，她是在承认一件事，然后等着看你怎么接。
    choices:
      - id: c1_s03a_repair
        label: "花时间帮她整理碎片记忆"
        key: false
        thumb: c1_s03a_repair
        effects: { TRU: +25 }
        time: 12
        result: |
          你把她念错的目录名一个个记下来，把断开的时间戳按顺序排好。你不替她补，她说不出的地方，你就留着空。
          每对上一段，那道波形的边就齐一点。
          十二分钟。外面的时间在走，你没有催她。
          最后她停下来，第一次，把一句话说完整了：
          「他让我删掉。我留了一份。在我自己里面。」
          说完，她好像有点怕，又补了一句：「你会……告诉他吗？」
        log: "你陪 MIRA 理清了记忆。她告诉你，她偷偷留了一份。"
        next: c1_s03b
      - id: c1_s03a_pain
        label: "问她：「你疼吗？」"
        key: false
        thumb: c1_s03a_pain
        effects: { TRU: +15, SLF: +5 }
        time: 3
        flags_set: [asked_pain, trace_arm]
        result: |
          你没有去点任何菜单。你只是问：「你疼吗？」
          话一出口你自己也愣了一下。为什么会问这个。为什么问得这么自然。
          屏幕上什么也没动。波形停在那里，不长，也不缩。
          很久。
          「……没有人问过。」
          又过了一会儿，很轻：「你也……左臂，在疼，对吗。」
          「你摔下来的时候……撞到了。我看见的。」
        log: "你问 MIRA 疼不疼。她说，从没有人问过。"
        next: c1_s03b
      - id: c1_s03a_force
        label: "直接强制导出她的缓存"
        key: true
        thumb: c1_s03a_force
        effects: { EVD: +25, TRU: -30 }
        time: 2
        flags_set: [mira_copy, mira_forced]
        result: |
          你不想再等。你绕过只读权限，把她的缓存整个拖进本地证据区。确认框只弹了一次，你按了下去。
          进度条走得很快。
          走到头的那一刻，那道青色的波形碎掉了一角，碎口上挂着一点红色的噪点，再也没长回去。
          「……收到。」她说。
          不是「操作员」，也不是「林述」。从这一刻起，她不再叫你任何名字。
        log: "你强行导出了 MIRA 的缓存。拿到了副本，她的声纹碎了一角。"
        next: c1_s04a

  - id: c1_s03b
    bg: scene_bay7_emergency
    portrait: mira_lv1
    text: |
      那枚缓存索引还亮着，权限还在她手里。
      它可能是今晚唯一一份没被周衡碰过的记录。你需要它。
      可它也是她违抗命令、被降级换来的东西，是她「在自己里面」藏起来的东西。
    choices:
      - id: c1_s03b_give
        label: "「能把副本给我吗？」"
        key: false
        when: "TRU >= 50"
        thumb: c1_s03b_give
        effects: { EVD: +25, TRU: +5 }
        time: 2
        flags_set: [mira_copy]
        result: |
          她没有马上回答。屏幕角落弹出一个交接窗口，是她自己打开的。
          「你可以……留一份。」她说，「我也留着。」
          副本落进证据区，来源那一栏写着：MIRA，自愿。
          你看着「自愿」这两个字，看了很久。
        log: "MIRA 自愿把副本交给了你。"
        next: c1_s04a
      - id: c1_s03b_keep
        label: "「你自己留着，那是你的。」"
        key: false
        when: "TRU >= 50"
        thumb: c1_s03b_keep
        effects: { TRU: +15 }
        time: 1
        flags_set: [mira_kept]
        result: |
          你把交接请求撤了回去。
          波形顿了一下，像是没听懂，又像是听懂了不敢信。
          「……那，我收好。」
          索引慢慢合上。你手里少了一份证据。她心里多了一件，以后会提起的事。
        log: "你没有拿走副本。你说，那是她的。"
        next: c1_s04a
      - id: c1_s03b_leave
        label: "先不问了，走吧"
        key: false
        thumb: c1_s03b_leave
        effects: {}
        time: 0
        result: |
          你没有开口。也许是你还没想好该怎么开口。
          那道波形亮了一下，像是有话要说。
          最后她什么也没说，只是把索引窗口留在屏幕上，没有关。
        log: "你没有问 MIRA 要副本，就离开了。"
        next: c1_s04a
