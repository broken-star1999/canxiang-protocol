    time: 1
    result: '「你可以现在发。」

      说完你才意识到，这不像林述会说的话。

      他很久没出声。「……你不像你。」

      挂断之前，他又补了一句，很轻：「谢谢。」

      '
    log: 你说他可以现在发。他说你不像你。
    next: c2_s04a
    flags_set:
    - zhou_heard
- id: c2_s04a
  bg: scene_bay7_emergency
  portrait: mira_lv1
  text: '他刚才翻纸的声音还在你耳朵里。你想起控制室终端上，常年开着一个没关的草稿窗口。

    你回到 T-03，用林述的账号连上控制室的终端。权限还在，像一扇没人记得锁的门。

    草稿箱里只有一封。没有收件人。

    草稿最后保存：四点十分。比那份报告的最后修改晚了三分钟。

    你知道，另存会在他的终端上留下一条访问记录。他早晚会看到，是林述的账号来过。

    开头两行，在预览栏里露出来：

    「我对唐棠撒了谎。她没有站得太近。是我让它不会停。」

    下面还有很多。滚动条很短。

    '
