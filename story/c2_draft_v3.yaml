      他没等你回答，自己说下去。说一季度验收的签字，说那两次演示都被急停误触发打断了，说贺总当着所有人的面问他，这条线到底还要不要。

      「接头下周就修了。」他说，「就差一周。」

      他在等你说话。

      '
- id: c2_s03a
