# 第二章《二十三个人》编剧亲笔 v3（2026-10-14）：按 review/c2_review_xingjian_v1.md 改，必须改 6 条全改，建议改 7、8、10、14、15 已改（9、11、12、13 在结局文件）
# writer_revised: true
# 新增：c2_s01b 手套判断节点（三个普通选项，暂不加数值，id 待谜题设计确认：c2_s01b_tang / _lin / _self，flag c2_glove_guess_*，第三章复盘揭晓）。
# 新增内部 flag：c2_via_log、c2_via_ring（仅供 c2_s02a 文本分支）。其余 id 与 c2_effects_v1.yaml 不变。
scenes:
- id: c2_s00a
  bg: scene_corridor_intercom
  portrait: mira_lv1
  text: '对讲屏亮着，不响，也不灭。屏幕正中只有一行字：

    来电：控制室 · 周衡

    还没接通。光标在「接听」两个字下面一闪一闪，很耐心，好像知道你一定会接。

    你站在屏幕前。走廊很长，后面没有人。

    '
  text_by_echo:
    c1_mira:
      forced: 'MIRA 的波形缩在屏幕一角，只报了一句：「五点三十。」

        她没再说别的。

        '
      asked: 'MIRA 的声音压得很低：「他会问你在哪。」

        '
      mended: 'MIRA 的声音压得很低：「他会问你在哪。你想好怎么回答，再接。」

        '
    c1_cache:
      mail: '屏幕右下角，有一行很小的灰字：外发邮件 1 封 · 已记录。

        '
      none: '你想起那些证据还摊在 T-03 上，谁路过都能看见。

        '
  choices:
  - id: c2_s00a_log
    label: 先查来电记录
    thumb: c2_s00a_log
    effects:
      EVD: 3
    time: 1
    result: '你没碰「接听」，先点开了旁边的记录。

      控制室打来这台对讲屏，今晚是第三次。前两次都没人接。第一次，是在急停之后不到十分钟。

      他一直在找林述。

      '
    log: 你查了来电记录。他今晚找了林述三次。
    next: c2_s01a
    flags_set:
    - c2_via_log
  - id: c2_s00a_answer
    label: 直接接
    thumb: c2_s00a_answer
    effects: {}
    time: 0
    result: '你伸手按下去。屏幕闪了一下，显示「正在接通」，然后卡住了。

      线路那头传来很远的杂音，像有人把听筒放在桌上，走开去拿什么东西。

      '
    log: 你按了接听。他那边还没拿起听筒。
    next: c2_s01a
  - id: c2_s00a_ring
    label: 让它响
    thumb: c2_s00a_ring
    effects:
      SLF: 5
    time: 1
    result: '你没有动。屏幕亮着，你也站着，谁都不先开口。

      你想知道，如果林述不接，他会怎么做。

      '
    result_variants:
    - when: flag:login_mira
      text: '你没有动。屏幕亮着，你也站着，谁都不先开口。

        MIRA 轻声说：「那一笔还记在我名下。你不接，他也会先来问我。」

        你还是没有动。

        '
    log: 你让它一直亮着，没有接。
    next: c2_s01a
    flags_set:
    - c2_via_ring
- id: c2_s01a
  bg: scene_corridor_intercom
  portrait: mira_lv1
  text: '等的时候，左臂又麻了一下，从手肘一直麻到指尖。

    你低头。地上有一只手套，掉在对讲屏下面，指尖朝着你。灰色，腕口一圈反光条。

    和你手上戴的那只，是同一款。

    对讲屏旁边的值班板上，有人用记号笔写了一行，字迹很急：「唐棠 左前臂骨折 已转运」。

    如果唐棠已经走了，那这只手为什么在疼？

    '
  text_variants:
  - when: flag:ignored_arm
    text: '等的时候，左臂又麻了。这一次你没法不理它，从手肘一直麻到指尖，像有人隔着皮肤拧了一下螺丝。

      之前你一直没理会这只手。现在它不让你不理了。

      地上有一只手套，掉在对讲屏下面，指尖朝着你。灰色，腕口一圈反光条。

      和你手上戴的那只，是同一款。

      对讲屏旁边的值班板上，有人用记号笔写了一行，字迹很急：「唐棠 左前臂骨折 已转运」。

      如果唐棠已经走了，那这只手为什么在疼？

      '
  choices:
  - id: c2_s01a_glove
    label: 捡起手套，比一比
    thumb: c2_s01a_glove
    flags_set:
    - c2_took_glove
    effects:
      SLF: 8
    time: 1
    result: '你把它捡起来，和自己的手并排放着。

      一样的尺码。一样的反光条。左手那只的掌心有一道磨痕，你手上这只，同一个位置，也有。

      你把两只手套叠在一起，叠得严丝合缝。

      你告诉自己，工服都是统一发的。

      '
    log: 你比了那只手套。和你手上的一模一样，连磨痕都在同一处。
    next: c2_s01b
  - id: c2_s01a_ask
    label: 问 MIRA，唐棠现在在哪
    thumb: c2_s01a_ask
    flags_set:
    - c2_asked_mira
    effects:
      TRU: 5
    time: 1
    result: 'MIRA 调出一张表，几十行时间和编号，滚得很快。

      「医疗转运记录在这里。」她说，「你自己看吧。」

      你看了。看不出什么。

      '
    result_by_echo:
      c1_mira:
        mended: 'MIRA 停了一下，才开口：「两点三十一分，无人机离港。唐棠在上面。」

          「她已经不在站里了。」

          你点点头。点完才发现，你不知道自己在同意什么。

          '
        asked: 'MIRA 停了一下，才开口：「两点三十一分，无人机离港。唐棠在上面。」

          「她已经不在站里了。」

          你点点头。点完才发现，你不知道自己在同意什么。

          '
    log: 你问了 MIRA 唐棠在哪。
    next: c2_s01b
  - id: c2_s01a_none
    label: 不想了
    thumb: c2_s01a_none
    effects:
      SLF: -5
    time: 0
    result: '手麻是因为累。手套是别人掉的。值班板上写的是值班板上的事。

      你把这三件事分开放好，一件都不去碰。

      '
    log: 你没有再想那只手。
    next: c2_s01b
- id: c2_s01b
  bg: scene_corridor_intercom
  portrait: mira_lv1
  text: '对讲屏还在等。你看着手里那只手套。

    掌心的磨痕，尺码，反光条。还有你左臂里那一点说不清的麻。

    你得先给自己一个答案，哪怕只是暂时的。

    这只手套，是谁的？

    '
  choices:
  - id: c2_s01b_tang
    label: 「是唐棠的。她掉在这里了。」
    thumb: c2_s01b_tang
    flags_set:
    - c2_glove_guess_tang
    effects: {}
    time: 0
    result: '最说得通的答案。她出事的时候就在这附近，手套掉了，没人顾得上捡。

      你把它放在值班板下面，像替谁收好一件东西。

      '
    log: 你判断手套是唐棠的。
    next: c2_s02a
  - id: c2_s01b_lin
    label: 「是林述的。是我早先掉的。」
    thumb: c2_s01b_lin
    flags_set:
    - c2_glove_guess_lin
    effects: {}
    time: 0
    result: '你今晚来过这里，也许不止一次。掉一只手套，再正常不过。

      只是你想不起来，是什么时候摘下它的。

      '
    log: 你判断手套是林述的。
    next: c2_s02a
  - id: c2_s01b_self
    label: 「是我的。」
    thumb: c2_s01b_self
    flags_set:
    - c2_glove_guess_self
    effects: {}
    time: 0
    result: '你说不清「我」指的是谁。

      可手套上的磨痕，和你掌心发麻的位置，是同一处。

      '
    log: 你判断手套是你自己的。
    next: c2_s02a
- id: c2_s02a
  bg: scene_corridor_intercom
  portrait: zhou_voice
  text: '线路接通了。

    「林述？」

    是个男人的声音，不高，有点哑，像一整夜都在说话。

    「我让你回宿舍休息，你回来干什么。」

    他没等你回答，自己说下去。说一季度验收的签字，说那两次演示都被急停误触发打断了，说贺总当着所有人的面问他，这条线到底还要不要。

    「接头下周就修了。」他说，「就差一周。」

    他在等你说话。

    '
  choices:
  - id: c2_s02a_play
    label: 以林述的身份周旋
    key: true
    echo_set:
      c2_stance: play
    flags_set:
    - trace_he_zheng
    thumb: c2_s02a_play
    effects:
      EVD: 8
      EXP: 5
    time: 2
    result: '「我睡不着。」你说，「回来看看。」

      这句话说出口，轻得像真的。

      他那边松了一点，叹了口气。「我也睡不着。」

      然后他说了很多。说到后来，他压低声音：

      「你以为我想这样？那是二十三个人。二十三个人的房贷、孩子的学费，我一个一个看着他们签的入职。」

      「贺总的意思是，机器可以召回，人不能。这不是我说的，可我得替他说。」

      他顿了顿，声音低下去：「唐棠……她站得太近了。我只能这么告诉她。」

      '
    log: 你用林述的语气和他说话。他提到了贺总那句话。
    next:
    - when: echo:c2_stance in [play,silent] && (TRU >= 55 || SLF >= 30)
      to: c2_s03a_heard
    - to: c2_s03a
  - id: c2_s02a_confront
    label: 「我知道 K1 的事。」
    key: true
    echo_set:
      c2_stance: confront
    thumb: c2_s02a_confront
    effects:
      EVD: 5
      EXP: 20
    time: 1
    result: '「我知道 K1 的事。」

      电话那头没有声音。很久。久到你以为线断了。

      然后是一声很重的闷响，像椅子向后倒在地上。

      他再开口的时候，声音冷下来，一点都不哑了。

      「你知道什么？」

      你没有回答。他自己接了下去，一个字一个字：「她站得太近。报告上写得很清楚。」

      '
    log: 你说你知道 K1 的事。那头传来椅子倒地的声音。
    next: c2_s03a
  - id: c2_s02a_silent
    label: 什么都不说
    key: true
    echo_set:
      c2_stance: silent
    thumb: c2_s02a_silent
    effects:
      EVD: 2
      EXP: -5
      SLF: 10
    time: 2
    result: '你没有说话。

      他等了一会儿，声音软下来：「……你在哭？」

      你没有回答。他也就不再问，自己说下去，像在跟一个不会还嘴的人说话。

      「那是二十三个人。我一个一个看着他们签的入职。」

      「唐棠……她站得太近了。我只能这么告诉她。」

      说完，他自己停了一下。

      '
    log: 你一直没出声。他以为你在哭，自己说了下去。
    next:
    - when: echo:c2_stance in [play,silent] && (TRU >= 55 || SLF >= 30)
      to: c2_s03a_heard
    - to: c2_s03a
  text_variants:
  - when: flag:c2_via_log
    text: '你点回通话界面，按了接听。线路接通了。

      「林述？」

      是个男人的声音，不高，有点哑，像一整夜都在说话。

      「我让你回宿舍休息，你回来干什么。」

      他没等你回答，自己说下去。说一季度验收的签字，说那两次演示都被急停误触发打断了，说贺总当着所有人的面问他，这条线到底还要不要。

      「接头下周就修了。」他说，「就差一周。」

